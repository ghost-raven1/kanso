name: Kanso checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: kanso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - run: npm run test:browser
      - run: npm run test:tooling
      - run: npm run test:seo
      - run: npm run test:hmr
      - run: npm run test:dx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-tooling-results
          path: |
            output/browser/
            output/tooling/results.json
            output/seo/
            output/hmr/results.json
            output/dx/results.json
