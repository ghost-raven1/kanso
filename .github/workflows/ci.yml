name: Kanso checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: kanso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - run: npm run test:browser
      - run: npm run test:compatibility
      - run: npm run test:tooling
      - run: npm run test:seo
      - run: npm run test:hmr
      - run: npm run test:dx
      - run: npm run test:web
      - run: npm run test:workers
      - run: npm run test:service-workers
      - run: npm run test:microfrontends-dx
      - run: npm run test:microfrontends-dev
      - run: npm run test:microfrontends
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-tooling-results
          path: |
            output/browser/
            output/compatibility/results.json
            output/tooling/results.json
            output/seo/
            output/hmr/results.json
            output/dx/results.json
            output/web/results.json
            output/web/catalog-mobile.png
            output/workers/results.json
            output/service-workers/results.json
            output/microfrontends-dx/results.json
            output/microfrontends-dev/*.json
            output/microfrontends-dev/*.html
            output/microfrontends-dev/*.log
            output/microfrontends/results.json
